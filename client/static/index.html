<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="app">
        <!-- Ambient background -->
        <div class="ambient-bg">
            <div class="orb orb-1"></div>
            <div class="orb orb-2"></div>
            <div class="orb orb-3"></div>
        </div>

        <!-- Top bar -->
        <header class="top-bar">
            <div class="connection-status" id="connectionStatus">
                <span class="status-dot"></span>
                <span class="status-text">Connecting...</span>
            </div>
            <button class="icon-btn" id="settingsBtn" title="Settings">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72 1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                </svg>
            </button>
        </header>

        <!-- Main stage -->
        <main class="stage">
            <!-- Avatar -->
            <div class="avatar-wrapper" id="avatarContainer">
                <!-- Glow rings -->
                <div class="avatar-glow">
                    <div class="glow-ring glow-ring-1"></div>
                    <div class="glow-ring glow-ring-2"></div>
                </div>

                <div class="avatar-frame">
                    <img id="avatarImage" class="avatar-img" alt="Avatar" />
                    <div class="avatar-loading" id="avatarLoading">
                        <div class="loader"></div>
                    </div>
                </div>

                <!-- Avatar status badge -->
                <div class="avatar-badge" id="avatarStatus">
                    <span class="status-indicator"></span>
                    <span class="status-text">Idle</span>
                </div>
            </div>

            <!-- Live caption (shows current word being spoken) -->
            <div class="live-caption" id="liveCaption"></div>

            <!-- VAD status text -->
            <div class="vad-label" id="vadStatus"></div>
        </main>

        <!-- Controls dock -->
        <div class="controls-dock">
            <!-- Replay button -->
            <button class="ctrl-btn ctrl-secondary hidden" id="replayBtn" disabled title="Replay">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="1 4 1 10 7 10"/>
                    <path d="M3.51 15a9 9 0 1 0 .49-5H1"/>
                </svg>
            </button>

            <!-- Mic button -->
            <div class="mic-wrapper" id="vadIndicator">
                <div class="mic-rings">
                    <div class="ring ring-1"></div>
                    <div class="ring ring-2"></div>
                    <div class="ring ring-3"></div>
                </div>
                <button class="mic-btn" id="micBtn">
                    <svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                        <line x1="12" y1="19" x2="12" y2="22"/>
                    </svg>
                    <svg class="mute-icon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="1" y1="1" x2="23" y2="23"/>
                        <path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V5a3 3 0 0 0-5.94-.6"/>
                        <path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2c0 .71-.08 1.4-.25 2.06"/>
                        <line x1="12" y1="19" x2="12" y2="22"/>
                    </svg>
                </button>
            </div>

            <!-- Stop button -->
            <button class="ctrl-btn ctrl-danger hidden" id="stopBtn" title="Stop">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="6" y="6" width="12" height="12" rx="2"/>
                </svg>
            </button>
        </div>

        <!-- Metrics (hidden by default, shown in compact form) -->
        <div class="metrics-bar hidden" id="metricsPanel">
            <span class="metric"><span class="metric-key">RTF</span> <span id="rtfValue">-</span></span>
            <span class="metric"><span class="metric-key">Gen</span> <span id="genTimeValue">-</span></span>
            <span class="metric"><span class="metric-key">Audio</span> <span id="audioDurValue">-</span></span>
            <span class="metric"><span class="metric-key">Word</span> <span id="currentWordValue">-</span></span>
            <span class="metric"><span class="metric-key">FPS</span> <span id="videoFps">-</span></span>
            <span class="metric"><span class="metric-key">Frames</span> <span id="videoFrames">0</span></span>
        </div>

        <!-- Hidden elements needed by app.js -->
        <div id="chatMessages" class="hidden"></div>
        <div id="chatContainer" class="hidden"></div>
        <div id="avatarMetrics" class="hidden"></div>

        <!-- Settings Panel -->
        <div class="settings-panel hidden" id="settingsPanel">
            <div class="settings-overlay" id="settingsOverlay"></div>
            <div class="settings-content">
                <div class="settings-header">
                    <h2>Settings</h2>
                    <button class="icon-btn" id="closeSettingsBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"/>
                            <line x1="6" y1="6" x2="18" y2="18"/>
                        </svg>
                    </button>
                </div>
                <div class="settings-body">
                    <!-- VAD Settings -->
                    <div class="settings-section">
                        <h3>VAD</h3>
                        <div class="setting-item">
                            <label for="speechThreshold">Speech threshold (ms)</label>
                            <input type="range" id="speechThreshold" min="100" max="1000" value="200" step="50">
                            <span class="setting-value" id="speechThresholdValue">200</span>
                        </div>
                        <div class="setting-item">
                            <label for="silenceThreshold">Silence threshold (ms)</label>
                            <input type="range" id="silenceThreshold" min="500" max="3000" value="1500" step="100">
                            <span class="setting-value" id="silenceThresholdValue">1500</span>
                        </div>
                        <div class="setting-item">
                            <label for="earlySilenceThreshold">Early silence (ms)</label>
                            <input type="range" id="earlySilenceThreshold" min="100" max="1500" value="500" step="50">
                            <span class="setting-value" id="earlySilenceThresholdValue">500</span>
                        </div>
                    </div>
                    <!-- LLM Settings -->
                    <div class="settings-section">
                        <h3>LLM</h3>
                        <div class="setting-item">
                            <label for="llmTemperature">Temperature</label>
                            <input type="range" id="llmTemperature" min="0" max="2" value="0.7" step="0.1">
                            <span class="setting-value" id="llmTemperatureValue">0.7</span>
                        </div>
                        <div class="setting-item">
                            <label for="llmTopP">Top P</label>
                            <input type="range" id="llmTopP" min="0.1" max="1" value="0.9" step="0.05">
                            <span class="setting-value" id="llmTopPValue">0.9</span>
                        </div>
                        <div class="setting-item">
                            <label for="llmMaxTokens">Max tokens</label>
                            <input type="range" id="llmMaxTokens" min="64" max="1024" value="512" step="64">
                            <span class="setting-value" id="llmMaxTokensValue">512</span>
                        </div>
                        <div class="setting-item full-width">
                            <label for="systemPrompt">System prompt</label>
                            <textarea id="systemPrompt" rows="3"></textarea>
                        </div>
                    </div>
                    <!-- TTS Settings -->
                    <div class="settings-section">
                        <h3>TTS</h3>
                        <div class="setting-item">
                            <label for="ttsBackboneTemp">Backbone temp</label>
                            <input type="range" id="ttsBackboneTemp" min="0.01" max="1.5" value="0.01" step="0.01">
                            <span class="setting-value" id="ttsBackboneTempValue">0.01</span>
                        </div>
                        <div class="setting-item">
                            <label for="ttsBackboneTopP">Backbone top P</label>
                            <input type="range" id="ttsBackboneTopP" min="0.1" max="1" value="0.999" step="0.001">
                            <span class="setting-value" id="ttsBackboneTopPValue">0.999</span>
                        </div>
                        <div class="setting-item">
                            <label for="ttsDepthTemp">Depth temp</label>
                            <input type="range" id="ttsDepthTemp" min="0.01" max="1.5" value="0.01" step="0.01">
                            <span class="setting-value" id="ttsDepthTempValue">0.01</span>
                        </div>
                        <div class="setting-item">
                            <label for="ttsDepthTopP">Depth top P</label>
                            <input type="range" id="ttsDepthTopP" min="0.1" max="1" value="0.999" step="0.001">
                            <span class="setting-value" id="ttsDepthTopPValue">0.999</span>
                        </div>
                    </div>
                    <!-- MuseTalk Settings -->
                    <div class="settings-section">
                        <h3>MuseTalk</h3>
                        <div class="setting-item">
                            <label for="musetalkBatchSize">Batch size</label>
                            <input type="range" id="musetalkBatchSize" min="1" max="24" value="8" step="1">
                            <span class="setting-value" id="musetalkBatchSizeValue">8</span>
                        </div>
                        <div class="setting-item">
                            <label for="musetalkLookaheadChunks">Lookahead chunks</label>
                            <input type="range" id="musetalkLookaheadChunks" min="0" max="10" value="2" step="1">
                            <span class="setting-value" id="musetalkLookaheadChunksValue">2</span>
                        </div>
                    </div>
                    <!-- Buffer Settings -->
                    <div class="settings-section">
                        <h3>Buffer</h3>
                        <div class="setting-item full-width">
                            <label for="bufferFrames">Required frames</label>
                            <div class="buffer-controls">
                                <input type="number" id="bufferFrames" min="1" max="100" step="1" value="1">
                                <span class="setting-hint">1 frame = 40ms @ 25fps</span>
                            </div>
                            <div class="setting-hint" id="bufferCurrent"></div>
                        </div>
                    </div>
                </div>
                <div class="settings-footer">
                    <button class="btn btn-ghost" id="resetSettingsBtn">Reset</button>
                    <button class="btn btn-accent" id="saveSettingsBtn">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
